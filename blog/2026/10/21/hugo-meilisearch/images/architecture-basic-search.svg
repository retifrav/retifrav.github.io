<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 66 532 416" width="532" height="416" role="img" aria-labelledby="title desc">
  <title id="title">Basic search on YOUR-HOST</title>
  <desc id="desc">CI/CD builds the website with Hugo and deploys it to the server. The web-browser gets /index.json, which NGINX serves as a static file, and searches in it with the basic search.</desc>
  <style>
    text { font-family: Verdana, Geneva, "DejaVu Sans", sans-serif; font-size: 12px; fill: #333; }
    .mono { font-family: ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .head { font-size: 13px; font-weight: bold; fill: #4c4c4c; }
    .small { font-size: 11px; fill: #666; }
    .mid { text-anchor: middle; }
    .box { fill: #fff; stroke: #a6a6a6; stroke-width: 1; }
    .zone { fill: #f6f6f6; stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 6 4; }
    .flow { fill: none; stroke-width: 1.6; }
    .publishing { stroke: #1b3f5c; }
    .search { stroke: #1e8449; }
    .static { stroke: #8a8a8a; }
  </style>
  <defs>
    <marker id="arrow-publishing" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b3f5c"/>
    </marker>
    <marker id="arrow-search" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/>
    </marker>
    <marker id="arrow-static" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect y="66" width="532" height="416" fill="#fff"/>

  <!-- the server: NGINX and the website files -->
  <rect class="zone" x="260" y="86" width="252" height="376" rx="10"/>
  <text class="head" x="276" y="110">YOUR-HOST</text>

  <!-- in every box the first line is 30 below the header -->

  <!-- CI/CD, as wide as "Hugo builds the website" with the same padding on both sides, and so is the web-browser box -->
  <rect class="box" x="20" y="130" width="174" height="71" rx="6"/>
  <text class="head" x="34" y="154">CI/CD</text>
  <text x="34" y="184">Hugo builds the website</text>

  <!-- website files, as wide as the header with the same padding on both sides, and so is the NGINX box -->
  <rect class="box" x="290" y="130" width="202" height="126" rx="6"/>
  <text class="head mono" x="304" y="154">/var/www/YOUR-WEBSITE/</text>
  <text x="304" y="184">website content</text>
  <text class="small" x="304" y="200">rendered HTML content</text>
  <text class="mono" x="304" y="226">index.json</text>
  <text class="small" x="304" y="242">content titles and summaries</text>

  <!-- browser -->
  <rect class="box" x="20" y="358" width="174" height="71" rx="6"/>
  <text class="head" x="34" y="382">Web-browser</text>
  <text class="mono" x="34" y="412">search.js</text>

  <!-- NGINX -->
  <rect class="box" x="290" y="358" width="202" height="84" rx="6"/>
  <text class="head" x="304" y="382">NGINX</text>
  <text class="mono" x="304" y="412" style="font-size:11px">/index.json</text>
  <text class="small" x="304" y="428">basic search</text>

  <!-- publishing flow -->
  <path class="flow publishing" d="M194,180 H290" marker-end="url(#arrow-publishing)"/>
  <text class="small mid" x="227" y="172">deploy</text>

  <!-- search flow, from search.js straight to /index.json -->
  <path class="flow search" d="M194,409 H290" marker-end="url(#arrow-search)"/>
  <text class="mid" x="227" y="401" style="font-size:11px">GET</text>
  <path class="flow static" d="M391,358 V256" marker-end="url(#arrow-static)"/>
  <text class="small" x="401" y="311">serving static files</text>
</svg>
