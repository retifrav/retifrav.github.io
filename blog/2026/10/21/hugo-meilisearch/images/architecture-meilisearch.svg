<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 936 546" width="936" height="546" role="img" aria-labelledby="title desc">
  <title id="title">Meilisearch search on YOUR-HOST</title>
  <desc id="desc">CI/CD builds the website with Hugo and deploys it to the server, then runs index-for-search.py there over SSH, which reads search-records.json, splits content into index records and saves them into the index in Meilisearch with the writer key. The web-browser POSTs search queries to NGINX, which forwards them to the index with the search key. As a fallback, the web-browser uses the basic search with /index.json, which NGINX serves as a static file.</desc>
  <style>
    text { font-family: Verdana, Geneva, "DejaVu Sans", sans-serif; font-size: 12px; fill: #333; }
    .mono { font-family: ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .head { font-size: 13px; font-weight: bold; fill: #4c4c4c; }
    .small { font-size: 11px; fill: #666; }
    .mid { text-anchor: middle; }
    .box { fill: #fff; stroke: #a6a6a6; stroke-width: 1; }
    .zone { fill: #f6f6f6; stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 6 4; }
    .flow { fill: none; stroke-width: 1.6; }
    .indexing { stroke: #1b3f5c; }
    .search { stroke: #1e8449; }
    .fallback { stroke: #1e8449; stroke-dasharray: 5 4; }
    .static { stroke: #8a8a8a; }
    .key rect { fill: #fdf0d5; stroke: #b9770e; stroke-width: 1; }
    .key text { font-size: 11px; fill: #7a4f09; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow-indexing" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b3f5c"/>
    </marker>
    <marker id="arrow-search" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/>
    </marker>
    <marker id="arrow-static" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect y="20" width="936" height="546" fill="#fff"/>

  <!-- the server: NGINX, the website files, the indexing script and Meilisearch are all on one host -->
  <rect class="zone" x="260" y="86" width="656" height="460" rx="10"/>
  <text class="head" x="276" y="110">YOUR-HOST</text>

  <!-- in every box the first line is 30 below the header -->

  <!-- CI/CD, as wide as "Hugo builds the website" with the same padding on both sides, and so is the web-browser box -->
  <rect class="box" x="20" y="130" width="174" height="71" rx="6"/>
  <text class="head" x="34" y="154">CI/CD</text>
  <text x="34" y="184">Hugo builds the website</text>

  <!-- website files -->
  <rect class="box" x="290" y="130" width="280" height="168" rx="6"/>
  <text class="head mono" x="304" y="154">/var/www/YOUR-WEBSITE/</text>
  <!-- fixed width, so the reads arrow ends right after it with any monospace font -->
  <text x="304" y="184">website content</text>
  <text class="small" x="304" y="200">rendered HTML content</text>
  <text class="mono" x="304" y="226">index.json</text>
  <text class="small" x="304" y="242">content titles and summaries</text>
  <text class="mono" x="304" y="268" textLength="137">search-records.json</text>
  <text class="small" x="304" y="284">same HTML content prepared for indexing</text>

  <!-- indexing script -->
  <rect class="box" x="680" y="214" width="216" height="71" rx="6"/>
  <text class="head mono" x="694" y="238">index-for-search.py</text>
  <text x="694" y="268">Creates index records</text>

  <!-- browser -->
  <rect class="box" x="20" y="400" width="174" height="71" rx="6"/>
  <text class="head" x="34" y="424">Web-browser</text>
  <text class="mono" x="34" y="454">search.js</text>

  <!-- NGINX -->
  <rect class="box" x="290" y="400" width="280" height="126" rx="6"/>
  <text class="head" x="304" y="424">NGINX</text>
  <!-- fixed width, so the arrow to Meilisearch starts right after it with any monospace font -->
  <text class="mono" x="304" y="454" style="font-size:11px" textLength="245">/api/search/indexes/INDEX-NAME/search</text>
  <text class="small" x="304" y="470">proxy_pass to Meilisearch</text>
  <text class="mono" x="304" y="496" style="font-size:11px">/index.json</text>
  <text class="small" x="304" y="512">basic search</text>

  <!-- Meilisearch -->
  <!-- 8.4 higher than the NGINX box, so the header is as far above the INDEX-NAME box (21 from its baseline)
       as the headers are above the first lines of the other boxes, while that box stays on the search arrow line -->
  <rect class="box" x="680" y="391.6" width="216" height="110.4" rx="6"/>
  <text class="head" x="694" y="415.6">Meilisearch</text>
  <rect x="728" y="436.6" width="120" height="28.8" rx="5" fill="#eef7f1" stroke="#1e8449" stroke-width="1.6"/>
  <text class="mono mid" x="788" y="455">INDEX-NAME</text>
  <text class="small mono mid" x="788" y="488">127.0.0.1:7700</text>

  <!-- publishing and indexing flow -->
  <path class="flow indexing" d="M194,180 H290" marker-end="url(#arrow-indexing)"/>
  <text class="small mid" x="227" y="172">deploy</text>
  <path class="flow indexing" d="M110,130 V60 H788 V214" marker-end="url(#arrow-indexing)"/>
  <text class="small mid" x="449" y="50" style="fill:#333; font-family:&quot;Courier New&quot;, Courier, &quot;Liberation Mono&quot;, monospace">ssh YOUR-HOST "python ..." &lt; index-for-search.py</text>
  <path class="flow indexing" d="M680,264 H449" marker-end="url(#arrow-indexing)"/>
  <text class="small mid" x="625" y="256">reads</text>
  <path class="flow indexing" d="M788,285 V436.6" marker-end="url(#arrow-indexing)"/>
  <!-- halfway between the script and Meilisearch boxes -->
  <g class="key"><rect x="748" y="328.3" width="80" height="20" rx="10"/><text x="788" y="342.3">writer key</text></g>

  <!-- search flow, from search.js through the search route to the index on one line -->
  <path class="flow search" d="M194,451 H290" marker-end="url(#arrow-search)"/>
  <text class="mid" x="227" y="443" style="font-size:11px">POST q</text>
  <!-- out of the bottom of the browser box, like the ssh arrow out of the top of the CI/CD one -->
  <path class="flow fallback" d="M110,471 V493 H290" marker-end="url(#arrow-search)"/>
  <text class="small mid" x="227" y="485">fallback</text>
  <path class="flow search" d="M557,451 H728" marker-end="url(#arrow-search)"/>
  <!-- halfway between the NGINX and Meilisearch boxes -->
  <g class="key"><rect x="585" y="441" width="80" height="20" rx="10"/><text x="625" y="455">search key</text></g>
  <path class="flow static" d="M430,400 V298" marker-end="url(#arrow-static)"/>
  <text class="small" x="440" y="353">serving static files</text>
</svg>
